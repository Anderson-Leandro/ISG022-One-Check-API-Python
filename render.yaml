services:
  - type: web
    name: onecheck-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      # Deixe vazio para desabilitar /admin/*; com valor, as rotas também exigem token de admin
      - key: SEED_SECRET
        sync: false
      - key: SEED_ALLOW_DESTRUCTIVE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: onecheck-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: onecheck-db
    plan: free
    databaseName: onecheck
    user: onecheck
