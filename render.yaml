services:
  - type: web
    name: onecheck-api
    runtime: python
    region: oregon
    plan: free
    # Versões e hashes travados: o build falha se algum pacote baixado for diferente
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: bash start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      # Obrigatório fora de APP_ENV=development/test: a API não sobe sem um valor de 32+ caracteres
      - key: JWT_SECRET
        generateValue: true
      # O IP do cliente vem do X-Forwarded-For do proxy do Render (usado no limite de tentativas)
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: PUBLIC_BASE_URL
        sync: false
      # Deixe vazio para desabilitar /admin/*; com valor, as rotas também exigem token de admin
      - key: SEED_SECRET
        sync: false
      - key: SEED_ALLOW_DESTRUCTIVE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: onecheck-db
          property: connectionString
      # Origens do front separadas por vírgula (ex.: https://onecheck-web.onrender.com).
      # Sem valor, nenhum navegador em outra origem chama a API
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: onecheck-db
    plan: free
    databaseName: onecheck
    user: onecheck
