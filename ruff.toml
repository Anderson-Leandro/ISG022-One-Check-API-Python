# Lint e formatação (DEBT-004). O CI roda `ruff check .` e `ruff format --check .` no job test.
line-length = 120
target-version = "py312"
# Os trechos de código nos .md (relatórios, ADRs) são citações: ficam como foram escritos
extend-exclude = ["*.md"]

[lint]
# E4/E7/E9 e F: o conjunto padrão do ruff (erros reais); I: ordem dos imports; UP: sintaxe do Python 3.12;
# B: armadilhas comuns (bugbear)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Depends(...) e File(...) no default dos parâmetros é o padrão do FastAPI
    "E712",  # `coluna == True` monta a expressão SQL no SQLAlchemy; `is True` mudaria o filtro
    "E741",  # nomes como `l` só por estilo, sem risco de erro
    "UP046", # ApiResponse(Generic[T]) do Pydantic: a sintaxe nova de genéricos não traz ganho aqui
]
