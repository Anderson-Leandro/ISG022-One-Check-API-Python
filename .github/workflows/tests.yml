name: Testes

on:
  push:
  pull_request:
    branches: [main]

# O GITHUB_TOKEN só lê o repositório: nenhum passo precisa escrever (SEC-008).
# As actions são fixadas por SHA, porque uma tag pode ser movida para outro código;
# para atualizar, troque o SHA e o comentário de versão juntos
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onecheck
          POSTGRES_PASSWORD: onecheck
          POSTGRES_DB: onecheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://onecheck:onecheck@localhost:5432/onecheck_test
      JWT_SECRET: ci-secret-only-for-tests-0123456789abcdef
      SEED_SECRET: ci-seed-secret

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock
            requirements-test.txt

      - name: Instalar dependências
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-test.txt

      - name: Rodar testes
        run: pytest --cov-fail-under=70

  # Falha quando alguma dependência travada tem vulnerabilidade conhecida (SEC-006)
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Auditar dependências
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.lock --require-hashes --disable-pip
          pip-audit -r requirements-test.txt
