- id: SEC-011
  type: security
  title: Política de senha fraca
  epic: EP-006
  story: ''
  description: |-
    Severidade: low
    Locais: app/schemas.py:106
    Cenário: Senhas de 6 caracteres e comuns (ex.: 123456) são aceitas. Mesmo com o limite de tentativas de N6, credential stuffing distribuído acerta contas com senhas vazadas. bcrypt ignora o que passa de 72 bytes.
    Impacto: Baixo com o rate limit e o MFA nos perfis privilegiados; maior para locatários sem MFA.
    Recomendação: Mínimo de 10–12 caracteres, recusar senhas comuns/vazadas (lista local ou k-anonymity do HIBP) e max_length=72 bytes.
  acceptance_criteria:
  - O cenário de ataque descrito não é mais reproduzível (teste automatizado demonstra o caso negado).
