- id: SEC-001
  type: security
  title: Seed automático cria admin com senha e segredo MFA públicos
  epic: EP-006
  story: ''
  description: |-
    Severidade: critical
    Locais: start.sh:8, scripts/seed.py:25, scripts/seed.py:36, app/seed_service.py:25, app/seed_service.py:290, app/seed_service.py:364
    Cenário: O repositório é público. Todo start do container (Render e Docker) roda scripts/seed.py; em banco vazio ele cria admin@onecheck.local com senha conhecida e mfa_secret fixo. O atacante faz POST /auth/login com a senha do código, gera o TOTP com o segredo público e recebe um access_token de admin.
    Impacto: Tomada completa da API (todos os dados pessoais, contratos e vistorias) por anônimo pela internet. Probabilidade alta (técnica trivial, credenciais no repositório público) × impacto alto. A confirmar em produção: se as contas de seed ainda existem com a senha original (não testado contra o ambiente real).
    Recomendação: Remover a chamada do seed do start.sh (o bootstrap já é coberto por /admin/seed com SEED_SECRET). Em produção, gerar senha aleatória e não definir mfa_secret (o usuário configura no primeiro login, fluxo mfa_setup). Verificar agora em produção se admin@onecheck.local, gestor, vistoriadores e locatários de seed existem; se sim, trocar senha e resetar MFA (ou desativar as contas) e revogar refresh tokens.
  acceptance_criteria:
  - O cenário de ataque descrito não é mais reproduzível (teste automatizado demonstra o caso negado).
  - Existe teste do caso legítimo (permitido) que continua passando.
  - A correção segue a recomendação ou há ADR justificando outra abordagem.
  - Nenhum segredo ou dado sensível novo em código, log ou mensagem de erro.
  priority: must
  rank: 1080
  estimate: 3
  status: done
  sprint: 11
  phase: F4
