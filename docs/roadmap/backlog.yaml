- id: SEC-007
  type: security
  title: 'Hardening HTTP: CORS * com credenciais, /docs público e sem cabeçalhos de segurança'
  epic: EP-006
  story: ''
  description: |-
    Severidade: low
    Locais: app/main.py:40, app/config.py:65, render.yaml:30
    Cenário: Qualquer site pode chamar a API pelo navegador do usuário e ler as respostas. O impacto é baixo porque a autenticação é por header Bearer (não há credencial automática), mas qualquer adoção futura de cookies vira CSRF/roubo de dados imediato. /docs e /openapi.json mapeiam toda a superfície para o atacante.
    Impacto: Baixo hoje; vira alto se a autenticação passar a usar cookies.
    Recomendação: CORS_ORIGINS com a lista explícita de origens do front e allow_credentials=False; desabilitar /docs e /openapi.json em produção (ou protegê-los); adicionar HSTS, X-Content-Type-Options e Cache-Control: no-store nas respostas autenticadas.
  acceptance_criteria:
  - O cenário de ataque descrito não é mais reproduzível (teste automatizado demonstra o caso negado).
