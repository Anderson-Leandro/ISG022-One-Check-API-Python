    Refinado em 2026-11-11: a imagem base do Docker foi para o DEBT-021, que não tem incerteza. A solução do lock só se confirma num PR real do Dependabot.
    Movido para a Sprint 15 em 2026-11-13, por decisão do PO: o Dependabot só lê a configuração da branch padrão (main), então os critérios 1 e 2 só se provam com um PR real depois da release dev → main (TK-015). Formato previsto: pip-compile (requirements.in → requirements.lock com hashes e cabeçalho), sem mudar o comando de build do Render e do Docker.
  acceptance_criteria:
  - Um PR do Dependabot que muda uma dependência direta já traz o lock regenerado, com hashes, sem passo manual.
  - As dependências transitivas do lock recebem PRs de atualização.
