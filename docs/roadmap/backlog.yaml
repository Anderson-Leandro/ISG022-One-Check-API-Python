- id: SEC-017
  type: security
  title: IP de origem lido do primeiro item do X-Forwarded-For, controlado pelo cliente
  epic: EP-006
  story: ''
  description: |-
    Severidade: medium (era low; confirmado em 2026-11-10)
    Locais: render.yaml:18, app/rate_limit.py:74, app/auditoria.py:41
    Cenário: Se o proxy do Render acrescenta o IP real ao X-Forwarded-For enviado pelo cliente (em vez de sobrescrever), o cliente manda 'X-Forwarded-For: <IP aleatório>' a cada tentativa: o limite por IP (20 falhas/15 min) nunca dispara e log_operacao grava o IP forjado.
    Impacto: Contorna a camada por IP do limite de tentativas (o limite por conta continua) e torna o IP da trilha de auditoria (SEC-010) inconfiável. Baixa porque depende do comportamento do proxy, não verificado; vira Média se confirmado.
    Recomendação: Conferir no Render (enviar X-Forwarded-For forjado e ver o ip gravado em /logs). Se for acrescentado, usar o último item do cabeçalho (o que o proxy do Render adiciona) num middleware próprio, ou restringir FORWARDED_ALLOW_IPS à rede do proxy.
    Resultado (2026-11-10): login falho enviado ao Render com X-Forwarded-For: 203.0.113.9 gravou ip 203.0.113.9 no log_operacao. O proxy acrescenta, e o IP forjado era aceito.
  acceptance_criteria:
  - 'Dado um login falho com ''X-Forwarded-For: 203.0.113.9'' enviado ao Render, quando consultar GET /logs, então
    fica registrado se o IP gravado é o forjado (resultado anotado no item).'
  - Dado que o proxy acrescenta o cabeçalho, quando o cliente forjar o X-Forwarded-For, então o IP usado no limite
    de tentativas e na auditoria é o adicionado pelo proxy, e não o enviado pelo cliente (teste automatizado).
  - Dado 21 logins falhos do mesmo cliente com X-Forwarded-For diferentes a cada vez, quando a 21ª chegar, então
    a resposta é 429.
  - FORWARDED_ALLOW_IPS deixa de ser '*' ou há ADR justificando.
  priority: should
  rank: 40
  estimate: 3
  status: done
  sprint: 13
  phase: F6
  depends_on: []
  security:
    impact: medium
    refs:
    - OWASP API4:2023
    - CWE-348
    - STRIDE:S
    - STRIDE:R
    risk_id: R-008
  source:
    kind: security-audit
