- id: SEC-005
  type: security
  title: Troca de senha e reset de MFA não revogam as sessões existentes
  epic: EP-006
  story: ''
  description: |-
    Severidade: medium
    Locais: app/routers/usuarios.py:76, app/routers/usuarios.py:98, app/routers/usuarios.py:226, app/auth.py:80
    Cenário: Um atacante obtém a sessão da vítima (token roubado). A vítima, ou o admin, troca a senha e reseta o MFA. O refresh token do atacante continua gerando access tokens por até 30 dias, porque verify_refresh_token só confere hash, validade e usuário ativo.
    Impacto: A resposta a incidente não corta o acesso do atacante. Probabilidade média (exige token roubado) × impacto médio.
    Recomendação: Ao trocar a senha (pelo próprio usuário ou pelo admin), resetar o MFA ou mudar o perfil: apagar todos os RefreshToken do usuário e incluir no JWT uma versão de credencial (ex.: token_version) conferida em get_current_user. Considerar reduzir JWT_REFRESH_DAYS e detectar reuso de refresh token rotacionado.
  acceptance_criteria:
  - O cenário de ataque descrito não é mais reproduzível (teste automatizado demonstra o caso negado).
  - Existe teste do caso legítimo (permitido) que continua passando.
  - A correção segue a recomendação ou há ADR justificando outra abordagem.
