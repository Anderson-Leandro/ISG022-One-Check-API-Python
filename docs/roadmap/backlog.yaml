- id: SEC-004
  type: security
  title: Leitura por ID ignora o vínculo do vistoriador (contratos, agendamentos, imóveis)
  epic: EP-006
  story: ''
  description: |-
    Severidade: medium
    Locais: app/routers/contratos.py:129, app/routers/contratos.py:209, app/routers/imoveis.py:134, app/routers/imoveis.py:210, app/routers/imoveis.py:257
    Cenário: As listagens (contratos.py:51, imoveis.py:68-78) restringem o vistoriador aos contratos/imóveis em que tem checklist, mas GET /contratos/{id}, /contratos/{id}/agendamentos, /imoveis/{id}, /imoveis/{id}/endereco e /imoveis/{id}/comodos só restringem o locatário. Um vistoriador lê valor do aluguel, locatário, datas e endereço de qualquer contrato pelo ID.
    Impacto: Vazamento limitado de dados de negócio e de endereço a um usuário autenticado (mesmo padrão do item 6, corrigido em problemas). Probabilidade média × impacto médio.
    Recomendação: Um helper por recurso (como assert_acesso_problemas) aplicado igualmente à lista e ao acesso por ID; para o vistoriador, exigir Checklist.vistoriador_id == user.id no contrato. Definir com o negócio o alcance do perfil visualizador, que hoje lê tudo.
