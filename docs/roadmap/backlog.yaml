- id: SEC-002
  type: security
  title: Pillow 11.1.0 com CVEs críticas e Image.open aceita qualquer formato do upload
  epic: EP-006
  story: ''
  description: |-
    Severidade: high
    Locais: app/uploads.py:25, requirements.txt:11
    Cenário: Um locatário autenticado envia como 'foto' de problema um arquivo PSD, TIFF, FITS ou JPEG2000 malicioso. Image.open testa todos os plugins de formato antes de o código checar se é JPEG/PNG/WebP, e o decoder vulnerável processa o arquivo (ex.: CVE-2026-42311, execução de código via PSD; CVE-2026-25990, escrita fora dos limites; dezenas de DoS).
    Impacto: Execução de código ou queda do processo da API por qualquer usuário que possa enviar foto (locatário, vistoriador, admin). Probabilidade média (exige conta) × impacto alto.
    Recomendação: Atualizar para pillow>=13.0.0 e restringir o parser: Image.open(buf, formats=["JPEG", "PNG", "WEBP"]). Conferir a assinatura (magic bytes) antes de abrir e definir Image.MAX_IMAGE_PIXELS explicitamente.
  acceptance_criteria:
  - O cenário de ataque descrito não é mais reproduzível (teste automatizado demonstra o caso negado).
  - Existe teste do caso legítimo (permitido) que continua passando.
  - A correção segue a recomendação ou há ADR justificando outra abordagem.
  - Nenhum segredo ou dado sensível novo em código, log ou mensagem de erro.
