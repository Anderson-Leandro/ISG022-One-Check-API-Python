- id: SEC-006
  type: security
  title: Outras dependências com CVEs e sem lockfile (dependências transitivas não verificadas)
  epic: EP-006
  story: ''
  description: |-
    Severidade: medium
    Locais: requirements.txt:6, requirements.txt:10, requirements.txt:12
    Cenário: python-jose 3.3.0 tem CVEs críticas de confusão de algoritmo (CVE-2024-33663, CVE-2026-85394), mas a API usa só HS256 com algorithms fixo, então não são alcançáveis hoje. As CVEs do cryptography (PKCS#7, curvas SECT, X.509) também não estão no caminho de uso. Sem lockfile, Starlette, uvicorn, h11 e outras dependências transitivas não foram analisadas pelos scanners.
    Impacto: Hoje sem exploração conhecida no uso atual; risco de regressão silenciosa e de CVEs transitivas não detectadas. Média pela regra 'CVE alta sem exploit no uso atual'.
    Recomendação: Migrar de python-jose (sem manutenção ativa) para PyJWT; atualizar cryptography>=50, python-dotenv>=1.2.2 e pytest. Gerar lockfile com hashes (pip-tools/uv: requirements.lock) e rodar osv-scanner/trivy no CI.
  acceptance_criteria:
  - O cenário de ataque descrito não é mais reproduzível (teste automatizado demonstra o caso negado).
  - Existe teste do caso legítimo (permitido) que continua passando.
  - A correção segue a recomendação ou há ADR justificando outra abordagem.
  - Nenhum segredo ou dado sensível novo em código, log ou mensagem de erro.
  priority: should
