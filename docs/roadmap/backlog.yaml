  title: Gestor lê toda a trilha de auditoria, com IP e e-mails de todas as contas
  epic: EP-006
  story: ''
  description: |-
    Severidade: low
    Locais: app/routers/dashboard.py:85, app/routers/dashboard.py:118
    Cenário: Um gestor chama GET /logs?acao=login e obtém IP e horário de login de todos os usuários, inclusive dos admins, e os e-mails digitados nos logins falhos.
    Impacto: Exposição de dados pessoais (IP, padrão de acesso) além da necessidade do perfil; o backlog do produto define a auditoria como atribuição do admin. Exige conta de gestor.
    Recomendação: Restringir GET /logs ao admin, ou para o gestor omitir ip/detalhes e eventos de contas admin/gestor.
