  epic: EP-006
  story: ''
  description: |-
    Resto do antigo SEC-003 do product-backlog: IP e campos alterados já existem (SEC-010); falta a integridade do log.
    Decisão do PO em 2026-11-11: trigger no banco. Ele recusa UPDATE e DELETE em log_operacao, salvo numa transação marcada pela rotina de retenção (Marco Civil, LOG_RETENCAO_DIAS). É criado pela migração da inicialização (PostgreSQL; SQLite com trigger equivalente nos testes) e testado no Postgres do CI. A limitação vai para o ADR: o dono do banco ainda consegue desligar o trigger. Descartados: papéis no banco (exigiria papéis e outra DATABASE_URL no Render) e o controle só na aplicação.
  acceptance_criteria:
  - Dado uma conexão da aplicação com o banco, quando tentar UPDATE ou DELETE em log_operacao, então o banco recusa
    (trigger, decisão do PO em 2026-11-11), exceto a rotina de retenção, com a autorização da própria transação.
  - Não existe rota de edição ou exclusão de logs.
  - A decisão está num ADR.
