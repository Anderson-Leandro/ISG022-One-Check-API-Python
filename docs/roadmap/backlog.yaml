- id: SEC-032
  type: security
  title: Testes de negação de acesso aos checklists por quem não é dono
  epic: EP-004
  story: ''
  description: 'Avaliação SPK-005 (docs/quality/avaliacao-testes-2026-11-02.md, seções 1 a 3): a negação em _assert_pode_ver_checklist
    (app/routers/checklists.py:89-93) e em _assert_pode_aceitar (:73-75) nunca é executada; trocar ''and'' por ''or''
    na checagem do locatário não faz nenhum teste falhar. Só testes; o código atual está correto.'
  acceptance_criteria:
  - Dado um locatário de outro contrato, quando ele chama GET /checklists/{id}, então recebe 403 e o corpo não traz
    dados do checklist.
  - Dado um segundo vistoriador, quando ele chama GET /checklists/{id}, PUT itens, POST e DELETE fotos ou PATCH
    submeter num checklist que não é seu, então recebe 403 e o checklist fica inalterado no banco.
  - Dado um locatário de outro contrato, quando ele chama PATCH aceitar ou rejeitar, então recebe 403 e o status
    do checklist não muda.
  - Dado o gestor, quando ele chama GET /checklists/{id}, então recebe 200 (caso permitido).
  - Dado um vistoriador, quando ele lista GET /contratos/{id}/checklists, então só vê os checklists em que é o vistoriador.
  - GET /checklists/{id}/pdf e /download-pdf têm o caso do dono (200) e o de quem não é dono (403).
  - Com 'and' trocado por 'or' em _assert_pode_ver_checklist, pelo menos um teste falha (mutação conferida à mão
    e registrada no item).
  priority: must
  rank: 36
  estimate: 3
  status: review
  sprint: 12
  phase: F5
