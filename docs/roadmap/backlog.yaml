- id: SEC-003
  type: security
  title: 'DoS anônimo: multipart processado antes da autenticação, sem limite de corpo e com dependências vulneráveis'
  epic: EP-006
  story: ''
  description: |-
    Severidade: high
    Locais: app/routers/checklists.py:217, app/routers/checklists.py:244, requirements.txt:8, requirements.txt:1
    Cenário: Sem token, o atacante envia POST /checklists/x/itens/y/fotos com multipart de vários GB (ou com milhares de partes/cabeçalhos). O FastAPI interpreta e grava o corpo em arquivo temporário antes de responder 401 (verificado: um upload anônimo de 5 MB foi processado e só então recebeu 401). Repetido em paralelo, enche o disco e consome CPU. CVEs de DoS no python-multipart (CVE-2026-42561, CVE-2026-53539) e no Starlette (FileResponse com Range, CVE-2025-62727, alcançável pelo GET /uploads público) somam-se ao vetor.
    Impacto: Indisponibilidade da API por anônimo. Probabilidade alta × impacto médio (degradação/queda, sem perda de dados).
    Recomendação: Limitar o tamanho do corpo antes do roteamento (middleware que recusa Content-Length acima de MAX_UPLOAD_MB e corta corpos em streaming, além do limite no proxy). Atualizar python-multipart>=0.0.31 e FastAPI para uma versão com Starlette >= 0.49.1. Nas rotas de upload, fazer a autenticação como dependência de router e ler o arquivo em blocos, interrompendo ao passar do limite.
  acceptance_criteria:
  - O cenário de ataque descrito não é mais reproduzível (teste automatizado demonstra o caso negado).
  - Existe teste do caso legítimo (permitido) que continua passando.
  - A correção segue a recomendação ou há ADR justificando outra abordagem.
  - Nenhum segredo ou dado sensível novo em código, log ou mensagem de erro.
  priority: must
