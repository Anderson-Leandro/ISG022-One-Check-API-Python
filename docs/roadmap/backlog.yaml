- id: SEC-028
  type: security
  title: 'Direitos do titular (LGPD): exportar e anonimizar os próprios dados'
  epic: EP-006
  story: ''
  description: |-
    LGPD art. 18. Hoje a exclusão é lógica e mantém nome, e-mail e CPF.
    Decisão do PO em 2026-11-11: autoatendimento. Exportação: GET /usuarios/me/dados, em JSON, só com os próprios dados. Exclusão: o próprio usuário pede, com reautenticação (senha e código do MFA, se tiver). Na hora, o nome vira 'Usuário removido', o e-mail vira um valor único inválido e o CPF é apagado; a conta é desativada e as sessões são revogadas. Laudos e logs ficam (os logs guardam só o id), e um laudo gerado depois mostra 'Usuário removido'. O último admin ativo não pode se anonimizar. A decisão vai para um ADR.
  acceptance_criteria:
  - Dado um usuário autenticado, quando pedir a exportação, então recebe só os próprios dados pessoais.
  - Dado um pedido de exclusão aprovado, quando for executado, então nome, e-mail e CPF são anonimizados e os laudos
    continuam válidos.
  - Um usuário não exporta nem anonimiza dados de outro (teste negado).
