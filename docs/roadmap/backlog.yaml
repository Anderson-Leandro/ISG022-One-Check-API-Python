    ADR-0015'
  - 'PR #224 (merge a5d1009): PROXY_SALTOS=3 (Cloudflare, proxy do Render e rede interna)'
  - 'Render, 2026-11-10: login falho com X-Forwarded-For forjado grava o IP público de quem testou; redirect em
    https'
  - 'tests/integration/test_seguranca_ip_proxy.py: 26 testes'
