- id: SEC-010
  type: security
  title: Trilha de auditoria incompleta (sem IP, sem o que mudou nas alterações de usuário)
  epic: EP-006
  story: ''
  description: |-
    Severidade: low
    Locais: app/serializers.py:230, app/routers/usuarios.py:230, app/notification_service.py:17
    Cenário: Um admin troca a senha ou o perfil de outro usuário e o log só registra 'update usuario'. Nenhum evento registra o IP de origem, nem o login falho. As notificações gravam e-mail e conteúdo da mensagem no log da aplicação.
    Impacto: Investigação de incidente sem base (quem mudou o quê, de onde); PII em log de aplicação (LGPD).
